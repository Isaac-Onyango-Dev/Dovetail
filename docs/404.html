<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game over — Dovetail</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A0E">
<!-- Served for any missing path at any depth, so every URL here is absolute. -->
<link rel="icon" href="/Dovetail/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/Dovetail/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/Dovetail/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/Dovetail/site.css">
</head>
<body>
<div class="embers" aria-hidden="true">
  <span class="blob blob--ember"></span>
  <span class="blob blob--wine"></span>
</div>
<div class="grain" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>

<header class="topbar" data-stuck="1">
  <nav class="nav" aria-label="Main">
    <a class="wordmark" href="/Dovetail/">
      <img src="/Dovetail/favicon.svg" width="30" height="30" alt="">
      <span class="wm" aria-hidden="true"><span class="wm-kicker">Pad → Xbox</span><span class="wm-name">Dovetail</span></span>
      <span class="sr-only">Dovetail home</span>
    </a>
    <div class="nav-tail" style="margin-left:auto">
      <a class="nav-cta" href="/Dovetail/#ready">Get it free</a>
    </div>
  </nav>
</header>

<main class="over">
  <div>
    <p class="code">Error 404 · Page not found</p>
    <h1>Game<br>over</h1>
    <p>This page doesn't exist, or it did and then it didn't. The download is safe on the home page.</p>
    <p class="continue" aria-hidden="true">Continue? <b id="count">9</b></p>
    <div class="over-actions">
      <a class="btn-a" href="/Dovetail/" id="home"><span class="glyph" aria-hidden="true">A</span><span>Continue</span></a>
      <a class="btn-ghost" href="https://github.com/Isaac-Onyango-Dev/Dovetail"><span class="glyph" aria-hidden="true">B</span>Quit to GitHub</a>
    </div>
  </div>
</main>

<script>
  // An arcade countdown that goes nowhere on its own: it just stops at zero.
  const count = document.getElementById('count');
  let n = 9;
  const tick = setInterval(() => {
    n -= 1;
    count.textContent = n > 0 ? n : '0 — press A';
    if (n <= 0) clearInterval(tick);
  }, 1000);

  // Press A on a real pad (or the A key) to continue, B to quit.
  addEventListener('keydown', (e) => {
    if (e.key === 'a' || e.key === 'A') location.href = '/Dovetail/';
  });
  if ('getGamepads' in navigator) {
    const poll = () => {
      for (const pad of navigator.getGamepads()) {
        if (pad && pad.buttons[0] && pad.buttons[0].pressed) { location.href = '/Dovetail/'; return; }
        if (pad && pad.buttons[1] && pad.buttons[1].pressed) { location.href = 'https://github.com/Isaac-Onyango-Dev/Dovetail'; return; }
      }
      requestAnimationFrame(poll);
    };
    addEventListener('gamepadconnected', () => requestAnimationFrame(poll), { once: true });
  }
</script>
</body>
</html>
